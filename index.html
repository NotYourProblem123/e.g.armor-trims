function icon(shape,ramp,ghost){const c=mk(12,12),g=c.getContext('2d');SH[shape].split('|').forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch=='.')return;if(ghost){if(ch!='a')return;g.fillStyle='#454545'}else g.fillStyle=ramp['abcd'.indexOf(ch)];g.fillRect(x,y,1,1)}));return c}
const palOf=id=>D.pal[id].map(h=>h);
const matRamp=id=>{const p=D.pal[id];return[p[7],p[5],p[3],p[1]]};
const TPL=['#1b3b5a','#2e6a96','#5aa6d4','#bfe6fa'];
const mapC={};
function getMap(n){if(mapC[n])return mapC[n];const a=new Uint8Array(2048).fill(255);let i=0;D.maps[n].replace(/([.0-7])(\d+),/g,(m,c,k)=>{k=+k;if(c!='.')a.fill(+c,i,i+k);i+=k});return mapC[n]=a}

/* ---------- state ---------- */
let S=[0,1,2,3].map(()=>({p:null,a:null,m:null}));
let glow=true,spin=false,yaw=0,dirty=true,skinCv=null,legacy=false;
const darkerOK={iron:1,gold:1,diamond:1,netherite:1};
const palFor=(a,m)=>(a==m&&darkerOK[a])?m+'_darker':m;

/* ---------- UI ---------- */
const grid=$('#grid');
const cells=[];
for(let r=0;r<4;r++){const row=[];for(let c=0;c<3;c++){const b=document.createElement('button');b.className='slot';b.onclick=()=>pick(r,c);grid.appendChild(b);row.push(b)}
 const sd=document.createElement('div');sd.className='side';
 const a=document.createElement('button');a.className='sm';a.textContent='⤮';a.title='Random row';a.onclick=()=>{rowRand(r);sync()};
 const x=document.createElement('button');x.className='sm';x.textContent='✕';x.title='Clear row';x.onclick=()=>{S[r]={p:null,a:null,m:null};sync()};
 sd.append(a,x);grid.appendChild(sd);cells.push(row)}
function armList(r){return ARM.filter(a=>r==0||a[0]!='turtle')}
function rowRand(r){S[r]={p:rnd(PATS),a:rnd(armList(r))[0],m:rnd(MAT)[0]}}
function setIcon(btn,cv,label){btn.innerHTML='';cv.style.cssText='';btn.append(cv);const s=document.createElement('span');s.textContent=label;btn.append(s)}
function ui(){for(let r=0;r<4;r++){const s=S[r];
 setIcon(cells[r][0],s.p?icon('tpl',TPL):icon('tpl',0,1),s.p?cap(s.p)+' Trim':'None');
 const A=ARM.find(x=>x[0]==s.a);setIcon(cells[r][1],A?icon(PSH[r],A[2]):icon(PSH[r],0,1),A?A[1]:'None');
 const M=MAT.find(x=>x[0]==s.m);setIcon(cells[r][2],M?icon(M[2],matRamp(M[0])):icon('gem',0,1),M?M[1].replace(' Shard','').replace(' Crystals',''):'None')}}
function pick(r,c){
 const m=$('#modal'),b=$('#mbox');b.innerHTML='';const key=['p','a','m'][c];
 const h=document.createElement('h3');h.textContent=['Select trim template','Select armor – '+PIECE[r],'Select trim material'][c];b.append(h);
 const add=(box,id,name,cv,extra)=>{const o=document.createElement('button');o.className='opt'+(S[r][key]==id?' sel':'');o.append(cv);o.append(Object.assign(document.createElement('span'),{textContent:name}));
  if(extra){const i=document.createElement('i');i.textContent=extra;o.append(i)}o.onclick=()=>{S[r][key]=id;m.classList.remove('show');sync()};box.append(o)};
 const sec=(t)=>{const e=document.createElement('h4');e.textContent=t;b.append(e);const g=document.createElement('div');g.className='opts';b.append(g);return g};
 if(c==0){const g=sec('Templates');add(g,null,'None',icon('tpl',0,1));PATS.forEach(p=>add(g,p,cap(p),icon('tpl',TPL)))}
 if(c==1){const g=sec('Armor');add(g,null,'None',icon(PSH[r],0,1));armList(r).forEach(a=>add(g,a[0],a[1],icon(PSH[r],a[2])))}
 if(c==2){const g=sec('Vanilla materials');add(g,null,'None',icon('gem',0,1));MAT.filter(x=>!x[3]).forEach(x=>add(g,x[0],x[1],icon(x[2],matRamp(x[0]))));
  const g2=sec('More materials (datapack)');MAT.filter(x=>x[3]).forEach(x=>add(g2,x[0],x[1],icon(x[2],matRamp(x[0])),x[4]?'✦ glow':'NEW'))}
 m.classList.add('show')}
$('#modal').onclick=e=>{if(e.target.id=='modal')e.target.classList.remove('show')};
$('#bSpin').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
$('#bView').onclick=()=>{yaw=0;dirty=true};
$('#bGlow').onclick=e=>{glow=!glow;e.target.classList.toggle('on',glow);rebuild()};
$('#bRand').onclick=()=>{for(let r=0;r<4;r++)rowRand(r);sync()};
$('#bReset').onclick=()=>{S.forEach((_,i)=>S[i]={p:null,a:null,m:null});sync()};
$('#bCopy').onclick=async()=>{const u=location.href;try{await navigator.clipboard.writeText(u);$('#bCopy').textContent='Copied!'}catch(e){prompt('Copy this URL',u)}setTimeout(()=>$('#bCopy').textContent='Copy URL',1200)};
function hash(){return S.map(s=>[s.p,s.a,s.m].map(v=>v||'-').join('.')).join(',')}
function readHash(){const h=decodeURIComponent(location.hash.slice(1));if(!h)return;h.split(',').slice(0,4).forEach((t,i)=>{const [p,a,m]=t.split('.').map(v=>v=='-'?null:v);
 S[i]={p:PATS.includes(p)?p:null,a:ARM.some(x=>x[0]==a)?a:null,m:MAT.some(x=>x[0]==m)?m:null}})}
function sync(){history.replaceState(null,'','#'+hash());ui();rebuild()}

function steve(){const c=mk(64,64),g=c.getContext('2d');const R=(x,y,w,h,k)=>{g.fillStyle=k;g.fillRect(x,y,w,h)};
 const sk='#c58c6b',hr='#3a2615',sh='#00a7a7',pn='#3a3a9a';
 R(0,0,32,16,sk);R(8,0,8,8,hr);R(0,8,32,2,hr);R(24,8,8,8,hr);R(0,10,2,2,hr);R(6,10,2,2,hr);R(16,10,2,2,hr);R(22,10,2,2,hr);
 R(9,12,1,1,'#fff');R(10,12,1,1,'#3a2a8a');R(13,12,1,1,'#3a2a8a');R(14,12,1,1,'#fff');R(11,13,2,1,'#a8694b');R(10,14,4,1,'#7b4a35');
 R(16,16,24,16,sh);R(20,16,8,4,sh);
 for(const[x,y]of[[40,16],[32,48]]){R(x,y,16,16,sk);R(x+4,y,4,4,sh);R(x,y+4,16,3,sh)}
 for(const[x,y]of[[0,16],[16,48]]){R(x,y,16,16,pn);R(x,y+12,16,4,'#6b6b6b');R(x+8,y,4,4,'#6b6b6b')}
 return c}
function setSkin(img){const c=mk(64,64);c.getContext('2d').drawImage(img,0,0);legacy=img.height<=32;skinCv=c;rebuild()}
$('#skin').onchange=e=>{const v=e.target.value;if(v=='steve'){skinCv=steve();legacy=false;rebuild()}
 if(v=='file')$('#file').click();
 if(v=='name'){const n=prompt('Minecraft username');if(!n)return;const urls=['https://minotar.net/skin/'+n,'https://mc-heads.net/skin/'+n];let i=0;const t=()=>{if(i>=urls.length){alert('Could not load that skin (blocked or unknown name). Try uploading the skin PNG instead.');return}const im=new Image();im.crossOrigin='anonymous';im.onload=()=>setSkin(im);im.onerror=t;im.src=urls[i++]};t()}};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>setSkin(im);im.src=URL.createObjectURL(f)};


/* ---------- vanilla armor from the user's own Minecraft .jar ---------- */
const VT={};let RAW=null;
function jarKey(n){let m;
 if(m=n.match(/^assets\/minecraft\/textures\/entity\/equipment\/humanoid(_leggings)?\/(\w+)\.png$/)){const a=m[2]=='turtle_scute'?'turtle':m[2]=='leather_overlay'?'leather_o':m[2];return ARM.some(x=>x[0]==a)||a=='leather_o'?a+'_'+(m[1]?2:1):null}
 if(m=n.match(/^assets\/minecraft\/textures\/models\/armor\/(\w+?)_layer_([12])(_overlay)?\.png$/)){const a=m[1]+(m[3]?'_o':'');return ARM.some(x=>x[0]==a)||a=='leather_o'?a+'_'+m[2]:null}
 return null}
async function readJar(file){
 const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),out={};
 let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!=0x06054b50)e--;
 if(e<0)throw 0;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const k=jarKey(new TextDecoder().decode(buf.subarray(p+46,p+46+nl)));p+=46+nl+xl+cl;if(!k)continue;
  const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=buf.subarray(ds,ds+csz);
  out[k]=meth==0?data:new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
 return out}
async function useRaw(raw){const img={};
 for(const k in raw){const bm=await createImageBitmap(new Blob([raw[k]],{type:'image/png'}));const c=mk(64,32);c.getContext('2d').drawImage(bm,0,0,64,32);img[k]=c}
 for(const k in img){if(!k.endsWith('_o_1')&&!k.endsWith('_o_2')&&!k.startsWith('leather_'))VT[k]=img[k]}
 for(const l of[1,2]){const b=img['leather_'+l];if(!b)continue;const c=mk(64,32),g=c.getContext('2d');g.drawImage(b,0,0);g.globalCompositeOperation='multiply';g.fillStyle='#a06540';g.fillRect(0,0,64,32);g.globalCompositeOperation='destination-in';g.drawImage(b,0,0);g.globalCompositeOperation='source-over';const o=img['leather_o_'+l];if(o)g.drawImage(o,0,0);VT['leather_'+l]=c}
 RAW=raw;$('#bJar').textContent='✓ Vanilla armor loaded (tap to reload)';rebuild()}
const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('vanillaArmor',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onerror=()=>r(null);q.onsuccess=()=>{const s=q.result.transaction('s',m=='get'?'readonly':'readwrite').objectStore('s'),x=m=='get'?s.get('raw'):s.put(v,'raw');x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)}}catch(e){r(null)}});
$('#bJar').onclick=()=>$('#jar').click();
$('#jar').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#bJar').textContent='Reading…';
 try{const raw=await readJar(f);if(!Object.keys(raw).some(k=>k.startsWith('iron_')))throw 0;await useRaw(raw);idb('put',raw)}catch(x){$('#bJar').textContent='⬆ Load vanilla armor textures (.jar)';alert('No armor textures found. Pick the Minecraft client .jar (e.g. .minecraft/versions/1.21.x/1.21.x.jar).')}};
idb('get').then(r=>{if(r)useRaw(r)});

/* ---------- textures ---------- */
const LV=[1,.92,.84,.76,.68,.58];
function shades(c){const w=c.width,h=c.height,id=c.getContext('2d').getImageData(0,0,w,h);return LV.map(m=>{const o=mk(w,h),g=o.getContext('2d'),d=g.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){d.data[i]=id.data[i]*m;d.data[i+1]=id.data[i+1]*m;d.data[i+2]=id.data[i+2]*m;d.data[i+3]=id.data[i+3]}g.putImageData(d,0,0);return o})}
const rect=(x,y,a,b,c,d)=>x>=a&&x<a+c&&y>=b&&y<b+d;
function inMask(i,x,y){
 if(i==0){if(y<8)return rect(x,y,8,0,8,8);if(y<16){if(x>=32)return false;if(x>=8&&x<16)return y<=11||x<10||x>13;return y<=14}return false}
 if(i==1)return rect(x,y,16,20,24,11)||rect(x,y,20,16,8,4)||rect(x,y,40,20,16,5)||rect(x,y,44,16,4,4);
 if(i==2)return rect(x,y,0,20,16,9)||rect(x,y,16,27,24,5)||rect(x,y,28,16,8,4);
 return rect(x,y,0,26,16,6)||rect(x,y,8,16,4,4)}
function inReg(i,x,y){return i==0?rect(x,y,0,0,32,16):i==1?rect(x,y,16,16,40,16):i==2?(rect(x,y,0,16,16,16)||rect(x,y,16,16,24,16)):rect(x,y,0,16,16,16)}
function baseTex(i,aid,trimMap){
 const vt=VT[aid+'_'+(i==2?2:1)];
 if(vt){const c=mk(64,32),g=c.getContext('2d');g.drawImage(vt,0,0);const d=g.getImageData(0,0,64,32);for(let y=0;y<32;y++)for(let x=0;x<64;x++)if(!inReg(i,x,y))d.data[(y*64+x)*4+3]=0;g.putImageData(d,0,0);return c}
 const A=ARM.find(x=>x[0]==aid),rp=A[2],c=mk(64,32),g=c.getContext('2d'),d=g.createImageData(64,32);
 const M=(x,y)=>x>=0&&y>=0&&x<64&&y<32&&(inMask(i,x,y)||(trimMap&&trimMap[y*64+x]!=255&&inReg(i,x,y)));
 for(let y=0;y<32;y++)for(let x=0;x<64;x++){if(!M(x,y))continue;
  const edge=!(M(x-1,y)&&M(x+1,y)&&M(x,y-1)&&M(x,y+1));
  let k=2+(((x*7+y*13)^(x*y))%4==0?1:0)-(((x*5+y*3)%7==0)?1:0);
  if(aid=='chainmail')k=((x+y)&1)?1:3;else if(aid=='leather')k=((x*3+y*5)%4==0)?1:2;
  if(edge)k=Math.min(k,1);
  const col=hx(rp[Math.max(0,Math.min(3,k))]),o=(y*64+x)*4;d.data[o]=col[0];d.data[o+1]=col[1];d.data[o+2]=col[2];d.data[o+3]=255}
 g.putImageData(d,0,0);return c}
function trimTex(i,pat,aid,mid,map){
 const pal=D.pal[palFor(aid,mid)].map(hx),c=mk(64,32),g=c.getContext('2d'),d=g.createImageData(64,32);
 for(let y=0;y<32;y++)for(let x=0;x<64;x++){const v=map[y*64+x];if(v==255||!inReg(i,x,y))continue;const o=(y*64+x)*4,p=pal[v];d.data[o]=p[0];d.data[o+1]=p[1];d.data[o+2]=p[2];d.data[o+3]=255}
 g.putImageData(d,0,0);return c}

/* ---------- geometry ---------- */
const PT={head:[-4,24,-4,8,8,8],body:[-4,12,-2,8,12,4],ra:[-8,12,-2,4,12,4],la:[4,12,-2,4,12,4],rl:[-4,0,-2,4,12,4],ll:[0,0,-2,4,12,4]};
const SKUV={head:[0,0,32,0],body:[16,16,16,32],ra:[40,16,40,32],la:[32,48,48,48],rl:[0,16,0,32],ll:[16,48,0,48]};
const AUV={head:[0,0],body:[16,16],ra:[40,16],la:[40,16,1],rl:[0,16],ll:[0,16,1]};
const ASL=[[['head',1]],[['body',1],['ra',1],['la',1]],[['body',.5],['rl',.5],['ll',.5]],[['rl',1],['ll',1]]];
function faces(p,e,u,v,mir){const[x0,y0,z0,w,h,d]=p,X0=x0-e,X1=x0+w+e,Y0=y0-e,Y1=y0+h+e,Z0=z0-e,Z1=z0+d+e;
 const f=[[[X0,Y1,Z1],[X1-X0,0,0],[0,Y0-Y1,0],[u+d,v+d,w,h]],[[X1,Y1,Z0],[X0-X1,0,0],[0,Y0-Y1,0],[u+2*d+w,v+d,w,h]],[[X0,Y1,Z0],[0,0,Z1-Z0],[0,Y0-Y1,0],[u,v+d,d,h]],[[X1,Y1,Z1],[0,0,Z0-Z1],[0,Y0-Y1,0],[u+d+w,v+d,d,h]],[[X0,Y1,Z0],[X1-X0,0,0],[0,0,Z1-Z0],[u+d,v,w,d]],[[X0,Y0,Z1],[X1-X0,0,0],[0,0,Z0-Z1],[u+d+w,v,w,d]]];
 if(mir){const t=f[2][3];f[2][3]=f[3][3];f[3][3]=t;f.forEach(q=>{q[0]=q[0].map((n,k)=>n+q[1][k]);q[1]=q[1].map(n=>-n)})}
 return f}
let BOX=[];
function rebuild(){BOX=[];
 const skin=skinCv||(skinCv=steve()),sk=shades(skin);
 const add=(tex,p,e,uv,mir,flat)=>BOX.push({tex,f:faces(PT[p],e,uv[0],uv[1],mir),flat});
 for(const p in PT){const u=SKUV[p];let a=[u[0],u[1]],m=0,o=[u[2],u[3]];
  if(legacy&&(p=='la'||p=='ll')){a=AUV[p];m=1;o=null}
  add(sk,p,0,a,m);if(o&&!(legacy&&p!='head'))add(sk,p,.25+(p=='head'?.25:0),o,m)}
 for(let i=0;i<4;i++){const s=S[i];if(!s.a)continue;
  const lg=i==2,pat=s.p&&s.m;let map=null;if(pat)map=getMap(s.p+(lg?'_leggings':''));
  const bt=shades(baseTex(i,s.a,map));
  const tt=pat?(()=>{const t=trimTex(i,s.p,s.a,s.m,map);const mm=MAT.find(x=>x[0]==s.m);const gl=glow&&mm[4];return{t:gl?[t,t,t,t,t,t]:shades(t),gl}})():null;
  ASL[i].forEach(([p,e])=>{const uv=AUV[p];add(bt,p,e+(p=='body'&&i==2?.0:0)+.01,uv,uv[2]);if(tt)add(tt.t,p,e+.03,uv,uv[2],tt.gl)})}
 dirty=true}

/* ---------- renderer ---------- */
const cv=$('#view'),ctx=cv.getContext('2d');
const dpr=Math.min(devicePixelRatio||1,2);
function fit(){const w=cv.clientWidth;cv.width=w*dpr;cv.height=w*4/3*dpr;dirty=true}
addEventListener('resize',fit);
const NRM=[[0,0,1],[0,0,-1],[-1,0,0],[1,0,0],[0,1,0],[0,-1,0]];
const L=(()=>{const v=[-.3,.6,.75],n=Math.hypot(...v);return v.map(x=>x/n)})();
function draw(){
 const W=cv.width,H=cv.height,sc=H/40,th=yaw,ph=.16,ct=Math.cos(th),st=Math.sin(th),cp=Math.cos(ph),sp=Math.sin(ph);
 const rot=([x,y,z])=>{const x1=x*ct+z*st,z1=-x*st+z*ct;return[x1,y*cp-z1*sp,y*sp+z1*cp]};
 const rotV=v=>rot(v);
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
 const list=[];
 for(const b of BOX)for(const f of b.f){const[O,U,V,src]=f;
  const nU=rotV(U),nV=rotV(V),n=rot(NRM[b.f.indexOf(f)]);
  if(n[2]<=0)continue;
  const P=rot(O),dep=P[2]+(nU[2]+nV[2])/2;
  const br=Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]),lv=b.flat?0:Math.min(5,Math.round((1-(.45+.55*br))*7));
  list.push({b,P,nU,nV,src,dep,lv})}
 list.sort((a,c)=>a.dep-c.dep);
 for(const q of list){const[sx,sy,sw,sh]=q.src;
  ctx.setTransform(sc,0,0,sc,W/2,H/2+16*sc);
  ctx.transform(q.nU[0]/sw,-q.nU[1]/sw,q.nV[0]/sh,-q.nV[1]/sh,q.P[0],-q.P[1]+0);
  if(q.b.flat){ctx.shadowColor='#fff8';ctx.shadowBlur=6*dpr}else ctx.shadowBlur=0;
  ctx.drawImage(q.b.tex[q.lv],sx,sy,sw,sh,0,0,sw+.02,sh+.02)}
 ctx.shadowBlur=0}
let drag=null;
cv.onpointerdown=e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
cv.onpointermove=e=>{if(drag==null)return;yaw+=(e.clientX-drag)*.012;drag=e.clientX;dirty=true};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};
(function loop(){if(spin){yaw+=.012;dirty=true}if(dirty){dirty=false;draw()}requestAnimationFrame(loop)})();
readHash();fit();ui();rebuild();
(async()=>{const raw={};for(const k in D.vt)raw[k]=Uint8Array.from(atob(D.vt[k]),c=>c.charCodeAt(0));
 await useRaw(raw);$('#bJar').textContent='⬆ Load other armor textures (.jar)';
 const im=new Image();im.onload=()=>{if(!skinCv||$('#skin').value=='steve')setSkin(im)};im.src='data:image/png;base64,'+D.steve})();
addEventListener('hashchange',()=>{readHash();ui();rebuild()});
</script></body></html>
